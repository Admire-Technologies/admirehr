      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r tests/performance/requirements.txt
      
      - name: Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/admire_hrms_test
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py migrate --noinput
      
      - name: Create test data
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/admire_hrms_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py create_default_permissions
          python manage.py shell -c "
          from django.contrib.auth import get_user_model;
          from apps.core.models import Company;
          User = get_user_model();
          company = Company.objects.create(name='Test Company', code='TEST');
          User.objects.create_superuser('admin', 'admin@test.com', 'admin123', company=company) if not User.objects.filter(username='admin').exists() else None
          "
      
      - name: Start backend server
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/admire_hrms_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py runserver 8000 &
          sleep 10
      
      - name: Run performance tests
        run: pytest tests/performance/ -v -s
      
      - name: Upload performance test results
        uses: actions/upload-artifact@v3
        with:
          name: performance-test-results
          path: tests/performance/results/

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: [backend-unit-tests]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: admire_hrms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
