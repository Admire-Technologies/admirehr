      - name: Upload security test results
        uses: actions/upload-artifact@v3
        with:
          name: security-test-results
          path: tests/security/results/

  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: [frontend-unit-tests]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Install Playwright and axe
        working-directory: ./frontend
        run: |
          npx playwright install --with-deps
          npm install --save-dev @axe-core/playwright
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      
      - name: Start frontend server
        working-directory: ./frontend
        run: |
          npm run start &
          sleep 10
      
      - name: Run accessibility tests
        working-directory: ./frontend
        run: npm run test:accessibility || true
      
      - name: Upload accessibility test results
        uses: actions/upload-artifact@v3
        with:
          name: accessibility-test-results
          path: frontend/accessibility-results/

  coverage-report:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, frontend-unit-tests, e2e-tests]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Download backend coverage
        uses: actions/download-artifact@v3
        with:
          name: backend-coverage-report
          path: coverage/backend
      
      - name: Download frontend coverage
        uses: actions/download-artifact@v3
        with:
          name: frontend-coverage-report
          path: coverage/frontend
      
      - name: Generate combined coverage report
        run: |
          echo "# Test Coverage Report" > coverage-summary.md
          echo "" >> coverage-summary.md
          echo "## Backend Coverage" >> coverage-summary.md
          echo "See backend coverage report in artifacts" >> coverage-summary.md
          echo "" >> coverage-summary.md
          echo "## Frontend Coverage" >> coverage-summary.md
          echo "See frontend coverage report in artifacts" >> coverage-summary.md
      
      - name: Upload combined coverage report
        uses: actions/upload-artifact@v3
        with:
          name: combined-coverage-report
          path: coverage/
      
      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Test Coverage Report\n\nCoverage reports have been generated. Check the artifacts for detailed reports.'
            })
