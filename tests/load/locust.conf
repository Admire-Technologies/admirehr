# Locust Configuration for Admire HRMS Load Testing

# Host to load test
host = http://localhost:8000

# Web UI settings
web-host = 0.0.0.0
web-port = 8089

# Load test settings
users = 100
spawn-rate = 10
run-time = 5m

# Logging
loglevel = INFO
logfile = locust.log

# Results
html = results/load-test-report.html
csv = results/load-test
