services:
  postgres:
    image: postgres:15
    container_name: admire_hrms_postgres
    environment:
      POSTGRES_DB: admire_hrms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - admire_network

  redis:
    image: redis:7-alpine
    container_name: admire_hrms_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - admire_network

volumes:
  postgres_data:
  redis_data:

networks:
  admire_network:
    driver: bridge